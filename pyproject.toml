[project]
name = "chatgpt-session-vault"
version = "0.1.0"
description = "Your ChatGPT conversations, beautifully archived. Local cookie-to-PDF export with optional Google Drive backup."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "curl-cffi>=0.13,<1",
  "markdown-it-py>=3,<5",
  "mdit-py-plugins>=0.4,<1",
  "pygments>=2.19,<3",
  "playwright>=1.50,<2",
  "platformdirs>=4,<5",
  "google-api-python-client>=2.160,<3",
  "google-auth-oauthlib>=1.2,<2",
  "oauthlib>=3.2,<4",
  "requests>=2.32,<3",
]

[project.scripts]
session-vault = "session_vault.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pypdf>=5,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/session_vault"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
